apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ai-agent-allow-telemetry
  namespace: istio-system
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/ai-agent/sa/ai-agent"
    to:
    - operation:
        methods: ["GET"]
        hosts:
        - "prometheus.istio-system.svc.cluster.local"
        - "tracing.istio-system.svc.cluster.local"
        - "kiali.istio-system.svc.cluster.local"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: lsd-backend-deny-agent
  namespace: lsd-payments
spec:
  selector:
    matchLabels:
      app: lsd-backend
  action: DENY
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/ai-agent/sa/ai-agent"
