apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-agent-remediator
rules:
- apiGroups: ["chaos-mesh.org"]
  resources: ["networkchaos", "httpchaos", "podchaos"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-agent-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexus-agent-remediator
subjects:
- kind: ServiceAccount
  name: ai-agent
  namespace: ai-agent
